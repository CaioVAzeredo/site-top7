<section class="banner-tela-grande">
  <div class="carrossel">
    <button class="carousel-btn prev" (click)="anterior()">‹</button>

    <div class="slides" [style.transform]="'translateX(-' + (indiceAtual * 100) + 'vw)'">
      <a *ngFor="let img of imagens" [href]="img.link" target="_self">
        <img [src]="img.src" [alt]="img.title">
      </a>
    </div>


    <button class="carousel-btn next" (click)="proximo()">›</button>

    <div class="carousel-indicators">
      <button *ngFor="let img of imagens; let i = index" class="indicator" [class.active]="i === indiceAtual"
        (click)="irParaSlide(i)">
      </button>
    </div>
  </div>
</section>
