<section class="escolas-page escolas" id="escolas-page">
    <h2 class="titulo">Escolas</h2>

    <div class="logos lista-escolas">
        <button type="button" class="logo-box card-escola" *ngFor="let escola of escolas; trackBy: trackByEscolaId"
            [routerLink]="['/escolas', escola.id]">
            <img [src]="escola.logo" [alt]="escola.nome" />
        </button>
    </div>
</section>
