<a class="unidade-card" [routerLink]="link ? link : ['/modalidade', id]">
    <div class="unidade-img">
        <img [src]="imagem" [alt]="titulo" />
    </div>

    <div class="unidade-body">
        <p class="unidade-titulo">{{ titulo }}</p>
        <span class="unidade-cta">Saiba mais</span>
    </div>
</a>
