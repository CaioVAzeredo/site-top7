<section class="modalidades" id="modalidades">
    <div class="container-modalidades">
        <div class="item" *ngFor="let unidade of unidades; trackBy: trackByUnidadeId">
            <app-unidade [id]="unidade.id" [imagem]="unidade.imagem" [titulo]="unidade.titulo"
                [link]="['/modalidade', escolaId, unidade.id]"></app-unidade>
        </div>
    </div>
</section>
