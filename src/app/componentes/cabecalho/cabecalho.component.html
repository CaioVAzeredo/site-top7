<header class="header" id="header">
    <a (click)="pagHome()">
        <img src="/assets/logoazul.png" alt="LOGO TOP7" class="logo" />
    </a>

    <nav>
        <ul class="itens" [class.show]="menuAberto">
            <li><a (click)="fecharMenuMobile(); pagHome()">Home</a></li>
            <li><a href="#sobre-nos" (click)="fecharMenuMobile()">Sobre a TOP7</a></li>

            <!-- ESCOLAS (dropdown) -->
            <li class="item-dropdown" [class.aberto]="dropdownEscolasAberto">
                <button type="button" class="escolas-trigger" (click)="toggleDropdownEscolas($event)"
                    [attr.aria-expanded]="dropdownEscolasAberto">
                    Escolas
                    <span class="caret" [class.aberto]="dropdownEscolasAberto"></span>
                </button>

                <div class="dropdown-escolas" *ngIf="dropdownEscolasAberto" (click)="$event.stopPropagation()">
                    <ng-container *ngFor="let escola of escolas; let last = last">
                        <button type="button" class="grupo-titulo" [class.aberto]="grupoAberto === escola.id"
                            (click)="toggleGrupo(escola.id)">
                            {{ getTituloGrupo(escola) }}
                            <span class="seta-grupo" [class.aberto]="grupoAberto === escola.id"></span>
                        </button>

                        <div class="grupo-lista" *ngIf="grupoAberto === escola.id">
                            <button type="button" class="item-escola" *ngFor="let unidade of escola.unidades"
                                (click)="selecionarUnidade(escola.id, unidade.id)">
                                {{ unidade.titulo }}
                            </button>
                        </div>

                        <!-- separador azul entre Ideal e Sigma -->
                        <div class="linha-separador" *ngIf="!last"></div>
                    </ng-container>
                </div>
            </li>

            <li><a href="#equipe" (click)="fecharMenuMobile()">Equipe</a></li>
            <li><a href="#contato" (click)="fecharMenuMobile()">Contato</a></li>
            <li>
                <a href="https://drive.google.com/drive/folders/1rO-btVcTDqPwEnH6ztDOmbjHgju_FDPk?usp=drive_link"
                    (click)="fecharMenuMobile()">
                    Festivais
                </a>
            </li>
            <li><a href="#" (click)="fecharMenuMobile()" (click)="botaoColoniaDeFerias()">Colônia de Férias</a></li>
        </ul>
    </nav>

    <div class="menu-cart">
        <span class="material-icons" (click)="statusMenu()">
            {{ menuAberto ? 'close' : 'menu' }}
        </span>
    </div>
</header>
